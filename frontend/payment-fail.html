<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оплата не завершена | Six Strings Store</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body class="page page--payment-fail">
    <div class="page__shell">
      <header class="header" data-shell="header"></header>

      <main class="page__main">
        <section class="payment-result payment-result--fail" data-payment-root>
          <div class="container payment-result__wrap">
            <p class="section-label">Оплата</p>
            <h1 class="section-title" data-payment-title>Статус платежа уточняется</h1>
            <p class="section-text" data-payment-message>
              Сейчас проверим, изменился ли статус заказа после возврата со страницы оплаты.
            </p>
            <p class="payment-result__badge order-card__status order-card__status--pending" data-payment-badge>
              Статус уточняется
            </p>
            <dl class="payment-result__meta" data-payment-meta hidden></dl>
            <div class="status-banner status-banner--accent" data-page-status>
              Получаем актуальные данные по заказу...
            </div>
            <div class="payment-result__actions">
              <a class="button button--primary" data-payment-primary href="./cart.html">Вернуться в корзину</a>
              <a class="button button--ghost" data-payment-secondary href="./catalog.html">В каталог</a>
            </div>
            <article class="payment-result__support">
              <p class="payment-result__support-label" data-payment-support-title>Что дальше</p>
              <p class="payment-result__support-text" data-payment-support-text>
                После проверки статуса страница подскажет, как продолжить сценарий покупки.
              </p>
              <ul class="payment-result__support-list" data-payment-support-list></ul>
            </article>
          </div>
        </section>
      </main>

      <footer class="footer" data-shell="footer"></footer>
    </div>

    <div class="toast-stack" data-toast-root aria-live="polite"></div>
    <script type="module" src="./src/js/pages/payment-fail.js"></script>
  </body>
</html>
